# Hifzoon — local backend stack (TRD section 16.3).
#
# The web app is deliberately absent: this file brings up the API, the worker and the
# dependencies they need. Frontend work uses its own compose file or points
# NEXT_PUBLIC_API_URL at the api service here.
#
# Ports 5432/6379 are the defaults. If something already holds them on your machine,
# override the published ports without editing this file:
#   POSTGRES_PORT=5435 REDIS_PORT=6382 docker compose up -d

name: hifzoon

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hifzoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hifzoon}
      POSTGRES_DB: ${POSTGRES_DB:-hifzoon}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` is the cheapest way to know migrations can run.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hifzoon} -d ${POSTGRES_DB:-hifzoon}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs a larger maxmemory policy than the default noeviction-safe default
    # in production; appendonly keeps delayed jobs across a restart.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing community images to Docker Hub and Quay, so `minio/minio` and
    # `minio/mc` no longer pull. Bitnami's frozen copies are the same server and client; this
    # is for local development only. Production uses real S3 (STORAGE_ENDPOINT).
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    command: ['minio', 'server', '/bitnami/minio/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      # The server binary exposes an unauthenticated liveness probe; `mc ready` needs
      # an alias that does not exist yet at this point, so curl is the cheapest check.
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket the API expects, then exits. Without this the API logs a
  # warning on boot and every upload 500s.
  #
  # The lifecycle rule is a backstop for the worker's own purge (data-request.processor
  # removes `exports/<id>.json` after RETENTION_DAYS.DATA_REQUEST_SLA). Keep the 30 days
  # in step with that constant. There is deliberately no rule on `recordings/`: the app
  # keeps a recording past 90 days when it is held for a case (`retainedForCaseId`), and
  # an unconditional expiry would destroy evidence.
  minio-init:
    image: bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/hifzoon;
      mc ilm rule rm --all --force local/hifzoon 2>/dev/null || true;
      mc ilm rule add --prefix 'exports/' --expire-days 30 local/hifzoon;
      exit 0;
      "

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '8025:8025' # web UI
      # SMTP. This was never published, so nothing could actually deliver to MailHog —
      # the service caught mail for no one. `MAIL_PROVIDER=smtp` + SMTP_HOST/SMTP_PORT
      # point the API and worker here.
      - '1025:1025'

  # Self-hosted LiveKit (open source, Apache-2.0): the video provider for classes.
  # The API reaches it at http://livekit:7880; browsers connect to ws://localhost:7880.
  # Set VIDEO_PROVIDER=livekit on the api and worker to use it (the default stays "fake").
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          # Advertise the host loopback so a browser on this machine can reach the media ports.
          node_ip: 127.0.0.1
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-hifzoon-dev-livekit-secret-0123456789}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls:
            - http://api:4000/api/v1/webhooks/video
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    depends_on:
      redis:
        condition: service_healthy

  # Records classes to the same bucket the app reads from. Opt in with
  # `docker compose --profile recording up -d`: it runs a headless browser, so it is heavy.
  livekit-egress:
    image: livekit/egress:latest
    profiles: ['recording']
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-hifzoon-dev-livekit-secret-0123456789}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    depends_on:
      - livekit
      - minio

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hifzoon}:${POSTGRES_PASSWORD:-hifzoon}@postgres:5432/${POSTGRES_DB:-hifzoon}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Inside the network the services are addressed by name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-hifzoon}:${POSTGRES_PASSWORD:-hifzoon}@postgres:5432/${POSTGRES_DB:-hifzoon}?schema=public
      REDIS_URL: redis://redis:6379
      # Server-side calls use the in-network address; links signed for browsers use the public one (B30).
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      # Mail goes to the MailHog service so every email is visible at http://localhost:8025.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:3000}
      # LiveKit: the api talks to it inside the network; browsers use the public URL.
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-hifzoon-dev-livekit-secret-0123456789}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-fake}
      COOKIE_SECURE: 'false'
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Same image as the API, different entry point (TRD section 4.2).
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hifzoon}:${POSTGRES_PASSWORD:-hifzoon}@postgres:5432/${POSTGRES_DB:-hifzoon}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      # Mail goes to the MailHog service so every email is visible at http://localhost:8025.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:3000}
      # LiveKit: the api talks to it inside the network; browsers use the public URL.
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-hifzoon-dev-livekit-secret-0123456789}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-fake}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
