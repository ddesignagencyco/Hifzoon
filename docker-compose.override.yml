# Hifzoon — developer overlay (TRD section 16.3).
#
# Applied automatically on top of docker-compose.yml. Differences from production:
#   * hot reload through `nest start --watch`
#   * source mounted into the container, so edits take effect without a rebuild
#   * the throttler and rate limits stay permissive enough for a fast test loop
#
# Never deploy this file. Staging and production use docker-compose.yml as-is.

name: hifzoon

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: deps
    working_dir: /repo/apps/api
    command: ['npx', 'nest', 'start', '--watch']
    entrypoint: ['/sbin/tini', '--']
    volumes:
      - ./tsconfig.base.json:/repo/tsconfig.base.json
      - ./apps/api:/repo/apps/api
      - ./packages/shared:/repo/packages/shared
      - /repo/apps/api/node_modules
      - /repo/packages/shared/node_modules
      - /repo/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    healthcheck:
      # Watch mode restarts constantly; a strict readiness probe would kill it.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: deps
    working_dir: /repo/apps/api
    command: ['npx', 'ts-node', '-r', 'tsconfig-paths/register', 'src/worker.ts']
    entrypoint: ['/sbin/tini', '--']
    volumes:
      - ./tsconfig.base.json:/repo/tsconfig.base.json
      - ./apps/api:/repo/apps/api
      - ./packages/shared:/repo/packages/shared
      - /repo/apps/api/node_modules
      - /repo/packages/shared/node_modules
      - /repo/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: deps
    working_dir: /repo/apps/api
    command: ['npx', 'prisma', 'migrate', 'deploy']
    volumes:
      - ./apps/api/prisma:/repo/apps/api/prisma
      - /repo/apps/api/node_modules
      - /repo/node_modules
